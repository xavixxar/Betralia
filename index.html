<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historias</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>

        <h1>Betralia</h1>

        <nav>
            <a href="index.html">Historias</a>
            <a href="#">Idiomas</a>
            <a href="#">Comunidad</a>
        </nav>

    </header>


    <main>

        <!-- SELECTOR DE IDIOMA -->

        <section class="language-selector">

            <h2>¿Qué idioma quieres aprender?</h2>


<div class="language-picker">

    <input
        type="text"
        id="language-search"
        placeholder="Buscar idioma..."
    >

    <select id="language"></select>

</div>


        </section>


        <!-- MÁS POPULARES -->

        <section>

            <div class="section-title">

                <h2>Más populares</h2>

                <a href="#">Ver todas →</a>

            </div>


            <div class="stories" id="popular-stories">

                <!-- Las historias aparecerán aquí mediante JavaScript -->

            </div>

        </section>


        <!-- MÁS RECIENTES -->

        <section>

            <div class="section-title">

                <h2>Más recientes</h2>

                <a href="#">Ver todas →</a>

            </div>


            <div class="stories" id="recent-stories">

                <!-- Las historias aparecerán aquí mediante JavaScript -->

            </div>

        </section>


        <!-- TODAS LAS HISTORIAS -->

        <section class="all-stories">

            <div class="section-title">

                <h2>Todas las historias</h2>

            </div>


            <input
                type="text"
                id="search"
                placeholder="🔍 Buscar historias..."
            >


            <div class="filters">

                <select id="level-filter">

                    <option value="todos">Todos los niveles</option>

                    <option value="A1">A1</option>
                    <option value="A2">A2</option>
                    <option value="B1">B1</option>
                    <option value="B2">B2</option>
                    <option value="C1">C1</option>
                    <option value="C2">C2</option>

                </select>


                <select id="sort">

                    <option value="default">Ordenar por</option>

                    <option value="popular">
                        Más populares
                    </option>

                    <option value="recent">
                        Más recientes
                    </option>

                    <option value="rating">
                        Mejor valoradas
                    </option>

                </select>

            </div>


            <div class="stories" id="all-stories">

                <!-- Todas las historias aparecerán aquí -->

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
