
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Il viaggio d'Anna</title>

    <link rel="stylesheet" href="../styles.css">

</head>


<body>


    <main class="story-page">

        <h1>Il viaggio d'Anna</h1>

        <p class="story-info">
            Italian · A1
        </p>

        <hr>


        <div class="story-text">


            <p class="sentence">

                <span
                    class="word"
                    data-translation="Hello, my name is Anna."
                >
                    Ciao, mi chiamo Anna
                </span>

            </p>


            <p class="sentence">

                <span
                    class="word"
                    data-translation="I live in a small city."
                >
                    Abito una citta piccolina.
                </span>

            </p>


            <p class="sentence">

                <span
                    class="word"
                    data-translation="I like to travel."
                >
                    Mi piace viaggiare.
                </span>

            </p>


        </div>


        <a
            href="../index.html"
            class="back-button"
        >
            ← Volver a historias
        </a>


    </main>


    <script>

        const words =
            document.querySelectorAll(".word");


        words.forEach(word => {

            word.addEventListener("click", () => {

                const translation =
                    word.dataset.translation;


                const existingTranslation =
                    word.nextElementSibling;


                // Si ya está abierta,
                // la cerramos.

                if (
                    existingTranslation &&
                    existingTranslation.classList.contains("translation")
                ) {

                    existingTranslation.remove();

                    return;

                }


                // Crear traducción

                const translationElement =
                    document.createElement("span");


                translationElement.classList.add(
                    "translation"
                );


                translationElement.textContent =
                    translation;


                // Mostrar traducción

                word.after(
                    translationElement
                );

            });

        });

    </script>


</body>

</html>
