
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pîer vat dins la vêla de Cessiae</title>

    <link rel="stylesheet" href="../styles.css">

</head>


<body>


    <main class="story-page">

        <h1>Pîer vat dins la vêla de Cessiae</h1>

        <p class="story-info">
            Arpetan · A1
        </p>

        <hr>


        <div class="story-text">


            <p class="sentence">

                <span
                    class="word"
                    data-translation="Pîer goes to the village of Cessieu"
                >
                    Pîer vat dins la vêla de Cessiae
                </span>

            </p>


            <p class="sentence">

                <span
                    class="word"
                    data-translation="because the market is on today, it's Wednesday"
                >
                    perque y at ló Marchîe çôl jôrn, y êt ló Dimècre 
                </span>

            </p>


            <p class="sentence">

                <span
                    class="word"
                    data-translation="and he wants to pick up some potatoes, eggs, and onions for the evening."
                >
                    vót prindre des patatas, dos ôves è dos onyons per ló sêr
                </span>

            </p>


        </div>


        <a
            href="../index.html"
            class="back-button"
        >
            ← Return to stories
        </a>


    </main>


    <script>

        const words =
            document.querySelectorAll(".word");


        words.forEach(word => {

            word.addEventListener("click", () => {

                const translation =
                    word.dataset.translation;


                const existingTranslation =
                    word.nextElementSibling;


                // Si ya está abierta,
                // la cerramos.

                if (
                    existingTranslation &&
                    existingTranslation.classList.contains("translation")
                ) {

                    existingTranslation.remove();

                    return;

                }


                // Crear traducción

                const translationElement =
                    document.createElement("span");


                translationElement.classList.add(
                    "translation"
                );


                translationElement.textContent =
                    translation;


                // Mostrar traducción

                word.after(
                    translationElement
                );

            });

        });

    </script>


</body>

</html>
