
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedro va oû marchi</title>

    <link rel="stylesheet" href="../styles.css">

</head>


<body>


    <main class="story-page">

        <h1>Pedro va oû marchi</h1>

        <p class="story-info">
            Normand Lechanteur · A1
        </p>

        <hr>


        <div class="story-text">


            <p class="sentence">

                <span
                    class="word"
                    data-translation="Pedro goes to the market,"
                >
                    Pedro va oû marchi,
                </span>

            </p>


            <p class="sentence">

                <span
                    class="word"
                    data-translation="he wants to buy potatoes, eggs and onions."
                >
                    i veurt acater des pounéterres, d's œus et d's ougnons.
                </span>

            </p>


            <p class="sentence">

                <span
                    class="word"
                    data-translation="for tonight's dinner."
                >
                    pour le dînnaer d'annyi.
                </span>

            </p>


        </div>


        <a
            href="../index.html"
            class="back-button"
        >
            ← Return to stories
        </a>
<audio controls>
    <source src="../Audios/Le-dînnaer-annyet.mp3" type="audio/mpeg">
</audio>

    </main>


    <script>

        const words =
            document.querySelectorAll(".word");


        words.forEach(word => {

            word.addEventListener("click", () => {

                const translation =
                    word.dataset.translation;


                const existingTranslation =
                    word.nextElementSibling;


                // Si ya está abierta,
                // la cerramos.

                if (
                    existingTranslation &&
                    existingTranslation.classList.contains("translation")
                ) {

                    existingTranslation.remove();

                    return;

                }


                // Crear traducción

                const translationElement =
                    document.createElement("span");


                translationElement.classList.add(
                    "translation"
                );


                translationElement.textContent =
                    translation;


                // Mostrar traducción

                word.after(
                    translationElement
                );

            });

        });

    </script>


</body>

</html>
